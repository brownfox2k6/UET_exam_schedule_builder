name: Build solvers

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  build:
    name: Build (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-24.04
          - macos-latest
          - windows-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.14"

      - name: Install OpenMP on macOS
        if: runner.os == 'macOS'
        run: brew install libomp

      - name: Install OR-Tools on macOS
        if: runner.os == 'macOS'
        run: brew install or-tools

      - name: Install OR-Tools on Ubuntu
        if: runner.os == 'Linux'
        run: |
          root="$RUNNER_TEMP/or-tools"
          mkdir --parents "$root"
          gh release download \
            --repo google/or-tools \
            --pattern 'or-tools_amd64_ubuntu-24.04_cpp_*.tar.gz' \
            --dir "$root"
          tar --extract --gzip --file "$root"/*.tar.gz --directory "$root"
          echo "ORTOOLS_ROOT=$(find "$root" -mindepth 1 -maxdepth 1 -type d -print -quit)" >> "$GITHUB_ENV"

      - name: Install OR-Tools on Windows
        if: runner.os == 'Windows'
        shell: bash
        run: |
          root="$RUNNER_TEMP/or-tools"
          mkdir --parents "$root"
          gh release download \
            --repo google/or-tools \
            --pattern 'or-tools_x64_VisualStudio2022_cpp_*.zip' \
            --dir "$root"
          unzip -q "$root"/*.zip -d "$root"
          echo "ORTOOLS_ROOT=$(find "$root" -mindepth 1 -maxdepth 1 -type d -print -quit)" >> "$GITHUB_ENV"

      - name: Upgrade pip
        run: python -m pip install --upgrade pip

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Configure CMake
        shell: bash
        run: |
          cmake_args=(
            -S solvers
            -B solvers/build-ci
            -DCMAKE_BUILD_TYPE=Release
          )
          if [[ "$RUNNER_OS" == "macOS" ]]; then
            cmake_args+=("-DOpenMP_ROOT=$(brew --prefix libomp)")
            cmake_args+=("-DCMAKE_PREFIX_PATH=$(brew --prefix or-tools)")
          else
            cmake_args+=("-DCMAKE_PREFIX_PATH=$ORTOOLS_ROOT")
          fi
          cmake "${cmake_args[@]}"

      - name: Build solvers
        run: cmake --build solvers/build-ci --config Release --parallel
