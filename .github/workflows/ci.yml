name: Build solvers

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  build:
    name: Build (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - macos-latest
          - windows-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.14"

      - name: Install OpenMP on macOS
        if: runner.os == 'macOS'
        run: brew install libomp

      - name: Install OR-Tools on macOS
        if: runner.os == 'macOS'
        run: brew install or-tools

      - name: Install OR-Tools on Ubuntu
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install --yes libortools-dev

      - name: Install OR-Tools on Windows
        if: runner.os == 'Windows'
        shell: bash
        run: |
          "$VCPKG_INSTALLATION_ROOT/vcpkg.exe" install ortools:x64-windows --clean-after-build

      - name: Upgrade pip
        run: python -m pip install --upgrade pip

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Configure CMake
        shell: bash
        run: |
          cmake_args=(-S solvers -B solvers/build-ci -DCMAKE_BUILD_TYPE=Release)
          if [[ "$RUNNER_OS" == "macOS" ]]; then
            cmake_args+=("-DOpenMP_ROOT=$(brew --prefix libomp)")
            cmake_args+=("-DCMAKE_PREFIX_PATH=$(brew --prefix or-tools)")
          elif [[ "$RUNNER_OS" == "Windows" ]]; then
            cmake_args+=("-DCMAKE_TOOLCHAIN_FILE=$VCPKG_INSTALLATION_ROOT/scripts/buildsystems/vcpkg.cmake")
            cmake_args+=("-DVCPKG_TARGET_TRIPLET=x64-windows")
          fi
          cmake "${cmake_args[@]}"

      - name: Build solvers
        run: cmake --build solvers/build-ci --config Release --parallel
