name: Build solvers

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  build:
    name: Build (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - macos-latest
          - windows-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install macOS OpenMP
        if: runner.os == 'macOS'
        run: brew install libomp

      - name: Upgrade pip
        run: python -m pip install --upgrade pip

      - name: Configure CMake
        shell: bash
        run: |
          cmake_args=(-S solvers -B solvers/build-ci -DCMAKE_BUILD_TYPE=Release)
          if [[ "$RUNNER_OS" == "macOS" ]]; then
            cmake_args+=("-DOpenMP_ROOT=$(brew --prefix libomp)")
          fi
          cmake "${cmake_args[@]}"

      - name: Build solvers
        run: cmake --build solvers/build-ci --config Release --parallel
